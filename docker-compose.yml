# Postgres and object storage.
#
# The FastAPI app runs on the host (see backend/README.md), so this file exists purely to
# provide the stateful services it needs: a database and an S3-compatible bucket for deal
# deliverable attachments. Everything else — the API image, Nginx, Redis — is deliberately
# absent; the API and Nginx definitions are kept in docker-compose.app.yml for whenever
# the containerised stack is wanted.

name: crm

services:
  db:
    image: postgres:17-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      # Avoids locale-dependent sort order surprises on a fresh cluster.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 5433 on the host, not 5432. This machine already runs a local PostgreSQL 18
      # service bound to 0.0.0.0:5432, which would win the IPv4 bind and silently receive
      # connections meant for this container. Mapping to 5433 leaves that instance alone.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The database name matters here: pg_isready returns true mid-initialisation
      # without it, so migrations could fire before the database actually exists.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # S3-compatible object storage for deal deliverable attachments.
  #
  # MinIO speaks the S3 API, so the application code is written against boto3 and nothing
  # about it is MinIO-specific. Production points S3_ENDPOINT_URL at AWS S3, Cloudflare R2
  # or Backblaze B2 instead and no code changes.
  #
  # One constraint worth knowing: the API signs upload URLs that the *browser* then calls,
  # so both must resolve the endpoint to the same host. With the API on the host machine
  # and the browser on the same machine, localhost:9000 works for both. If the API is ever
  # containerised (docker-compose.app.yml), it must still sign with the browser-reachable
  # address, not the internal "minio" hostname, or every upload URL will 403 on signature.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: crm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${S3_PORT:-9000}:9000"
      # Browser console, for eyeballing what actually landed in the bucket.
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Creates the bucket and exits. Without this the first upload fails on NoSuchBucket, and
  # having the API create buckets at runtime would mean giving it admin credentials it has
  # no other use for.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: crm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-crm-attachments} &&
      echo 'Bucket ${S3_BUCKET:-crm-attachments} ready'
      "

  # Catches every email the app sends and shows it in a browser, instead of delivering it.
  #
  # This exists so the real SMTP path runs in development. The alternative — leaving SMTP_HOST
  # blank — silently swaps in a logging stand-in, so the code that actually opens a connection,
  # negotiates TLS and hands over a message is never executed until production. Nudges and
  # reminder mail are worth more confidence than that.
  #
  # Pointing at real credentials later is a `.env` change and nothing else: SMTP_HOST, port,
  # user, password. No code moves.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: crm-mailpit
    restart: unless-stopped
    ports:
      # 1025 is the SMTP port the API sends to; 8025 is the web inbox you read.
      # Deliberately not named SMTP_PORT: that name belongs to the backend's client setting in
      # backend/.env, and one variable driving both a container mapping and a client would
      # break the moment they need to differ.
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      # Nothing is persisted. A dev mailbox that survives restarts just accumulates noise from
      # test runs, and every message here is reproducible by triggering the action again.
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  # A live view of the database in the browser. Development only — it is a second web app
  # with its own login, and nothing in production should reach the database this way.
  #
  # Runs behind a profile so it is opt-in:
  #     docker compose --profile tools up -d      starts Postgres and pgAdmin
  #     docker compose up -d                      starts Postgres alone
  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: crm-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@aidenai.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin1234}
      # Skips the "set a master password" prompt, which is pointless for a local container.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      # Pre-registers the CRM connection so there is nothing to configure on first open.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"

volumes:
  postgres_data:
  pgadmin_data:
  minio_data:
