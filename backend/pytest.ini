[pytest]
testpaths = tests
asyncio_mode = auto
# The engine and the test database are built once per session. Both the fixtures and the
# tests must therefore share one event loop — otherwise asyncpg connections created on the
# fixture's loop are used from a different one, which fails as
# "Task attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
